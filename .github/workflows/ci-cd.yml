# CI/CD: build once, test that build, then deploy the same files to GitHub Pages.
#
#   Build  ─►  Test (static checks · unit/Python/content · end-to-end + axe · reading level)  ─►  Deploy
#
# Branch flow: work on `dev` → pull request to `main` (tested here) → merge → deploy.
# Every push and pull request runs Build and Test. Deploy runs only for the `main` branch
# (on push, or by hand with "Run workflow"), and only once GitHub Pages is turned on with
# Settings → Pages → Source: "GitHub Actions". Until then it is skipped with a note.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a run on main part-way through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Where the site lives on its host: /<repo>/ for a GitHub Pages project site. Set the
  # repository variable SITE_BASE_PATH to "/" when using a custom domain.
  CODEWEALD_BASE: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

# Every job runs on Ubuntu 24.04: Playwright 1.56 can't install Chromium on the newer
# ubuntu-latest image (26.04). Move on together with a Playwright upgrade.
jobs:
  # ----- Stage 1: Build -------------------------------------------------------------------

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site (copies Python, draws the art, compiles content, type-checks, size budget)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ----- Stage 2: Test --------------------------------------------------------------------

  checks:
    name: Lint and format
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm run lint
      - run: npm run format:check

  unit:
    name: Unit, Python and content tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - name: Validate content (schema, references, every solution and wrong solution)
        run: npm run validate-content
      - name: Instructor answer key is up to date
        run: npm run solutions -- --check
      - run: npm test

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Play the built site in Chromium (golden path, keyboard, saves, axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  reading-level:
    name: Reading level
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Grade all student text (warns above grade 7, fails above grade 9)
        run: npm run reading-level -- --markdown reading-level.md
      - name: Add the report to the job summary
        if: always() && hashFiles('reading-level.md') != ''
        run: cat reading-level.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('reading-level.md') != ''
        with:
          name: reading-level
          path: reading-level.md
          retention-days: 30

  # ----- Stage 3: Deploy ------------------------------------------------------------------

  pages:
    name: Check GitHub Pages
    runs-on: ubuntu-24.04
    needs: [checks, unit, e2e, reading-level]
    # Deploy only from main: pushes to it, or a manual run on it. Never from other branches
    # or pull requests.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            note='Deploy skipped: turn on GitHub Pages with Settings → Pages → Source: "GitHub Actions", then re-run this workflow.'
            echo "::warning title=GitHub Pages is off::$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: pages
    if: needs.pages.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Get the tested site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
