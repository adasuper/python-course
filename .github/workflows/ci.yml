name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  tests:
    name: Unit, Python and content tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - name: Validate content (schema, references, every solution and wrong solution)
        run: npm run validate-content
      - name: Instructor answer key is up to date
        run: npm run solutions -- --check
      - run: npm test

  build-and-e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    needs: [checks, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (includes the size budget)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end, keyboard and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
