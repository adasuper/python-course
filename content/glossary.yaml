# yaml-language-server: $schema=../schema/glossary.schema.json
# Words students can click (or focus) to see a definition.
# Link a word in any story text with [[term]] or [[shown words|term]].
# Each definition is at most 2 sentences, and every entry has an example (rich text: put
# code in `backticks`, or in a ``` block for several lines).
- term: program
  definition: A list of instructions for the computer. The computer does them in order, from top to bottom.
  example: |
    ```python
    print("Hello!")
    print("Goodbye!")
    ```
  related: [instruction, sequence, code]
- term: code
  definition: The words and symbols you write to make a program.
  example: '`hero.move("up")` is one line of code.'
  related: [program]
- term: instruction
  definition: One step in a program, like "print this" or "move right". Most instructions sit on their own line.
  example: '`hero.move("right")`'
  related: [program, sequence]
- term: sequence
  definition: Things done in a set order. Python runs your lines in sequence, one after another.
  example: 'First `hero.move("up")`, then `hero.say("Hi")`.'
  related: [program, instruction]
- term: run
  definition: To make the computer follow your program. Press Run to see what your code does.
  example: Press **Run**, and the hero follows your program step by step.
  related: [program]
- term: print
  definition: An instruction that shows text on the Scroll of Output.
  example: '`print("Hello, Hearthvale!")`'
  related: [output, string]
- term: string
  definition: A piece of text in Python. A string goes inside quotes.
  example: '`"Hello"` and `''Hello''` are both strings.'
  related: [quotes]
- term: quotes
  definition: The marks around a string, like "this" or 'this'. The quote at the start must match the quote at the end.
  example: '`print("Bun''s Bakery")`'
  related: [string]
- term: output
  definition: What a program shows when it runs. In Codeweald, output appears on the Scroll of Output.
  example: '`print("Hi")` puts **Hi** on the Scroll of Output.'
  related: [print, scroll of output]
- term: Scroll of Output
  definition: The panel where your program's output appears. Each print makes a new line on it.
  example: Two `print` lines make two lines on the Scroll.
  related: [output, print]
- term: comment
  definition: "A note for humans that starts with #. Python skips it when the program runs."
  example: '`# This line is just a note.`'
  related: [code]
- term: error
  definition: A problem that stops Python from running your code. Every coder sees errors all the time, so they are nothing to worry about.
  example: '`Print("Hi")` gives an error, because Python only knows `print` with a small p.'
  related: [error message, bug]
- term: error message
  definition: Python's note about what went wrong. It tells you the kind of error and the line to check.
  example: '`SyntaxError on line 3`'
  related: [error, line number]
- term: line number
  definition: The number of a line in your code. Line 1 is at the top.
  example: An error on **line 3** means you should look at the third line.
  related: [error message]
- term: bug
  definition: A mistake in a program. Bugs can stop a program or make it do the wrong thing.
  example: The hero walks left when you meant right.
  related: [debugging, error]
- term: debugging
  definition: Finding and fixing bugs. You look for clues, make a guess, and test it.
  example: Run the code, read the Scroll, change one thing, and run it again.
  related: [bug]
- term: syntax
  definition: The spelling and grammar rules of a programming language. A missing quote or bracket breaks the syntax.
  example: '`print("Hi"` is missing its `)`, so the syntax is broken.'
  related: [error]
- term: case-sensitive
  definition: Python treats capital and small letters as different. print works, but Print does not.
  example: '`print("yes")` works, but `Print("yes")` does not.'
  related: [syntax]
- term: hero
  definition: Your character in a quest. You control the hero with instructions like hero.move("up").
  example: '`hero.say("Hi!")`'
  related: [instruction]
# Region 2: Whispering Library
- term: variable
  definition: A name for a value, like a labeled jar. You store a value in it with `=`.
  example: '`gold = 12` stores 12 in a variable named `gold`.'
  related: [value, assignment]
- term: value
  definition: The thing stored in a variable, like a number or a piece of text.
  example: 'In `pet = "owl"`, the value is `"owl"`.'
  related: [variable]
- term: assignment
  definition: Storing a value in a variable with `=`. Read `=` as "gets".
  example: '`score = 10` means "score gets 10".'
  related: [variable, reassign]
- term: reassign
  definition: To store a new value in a variable that already has one. The old value is gone.
  example: |
    ```python
    pet = "owl"
    pet = "bat"
    ```
  related: [assignment, variable]
- term: concatenate
  definition: To join strings into one longer string with `+`. It never adds spaces for you.
  example: '`"Find " + "owls"` gives `"Find owls"`.'
  related: [string]
- term: f-string
  definition: A string with an `f` before the first quote. Each `{name}` inside it is replaced by that variable's value.
  example: '`f"Hi {name}!"` shows `Hi Ada!` when `name` is `"Ada"`.'
  related: [string, variable]
# Region 5: The Endless Mines
- term: loop
  definition: Code that repeats. A loop runs the same lines again and again, so you don't have to write them many times.
  example: '`while digs < 3:` repeats the lines under it.'
  related: [while loop, infinite loop]
- term: while loop
  definition: A loop that repeats its indented lines as long as its condition is True. Python checks the condition before each repeat.
  example: |
    ```python
    digs = 0
    while digs < 3:
        print("Dig!")
        digs = digs + 1
    ```
  related: [loop, counter, break]
- term: counter
  definition: A variable that counts things. It usually starts at 0 and goes up by 1 each time something happens.
  example: '`gems = gems + 1`'
  related: [while loop]
- term: infinite loop
  definition: A loop that never stops, because its condition never turns False. Something inside the loop must change, so the loop can end.
  example: '`while True:` with no `break` runs forever.'
  related: [while loop, break]
- term: break
  definition: An instruction that jumps out of a loop right away. Python goes on with the first line after the loop.
  example: |
    ```python
    while True:
        print("Dig!")
        break
    ```
  related: [loop, while loop]
# Region 6: Clocktower Peaks
- term: for loop
  definition: A loop that runs its indented lines once for each value it is given. It knows how many times it will run before it starts.
  example: |
    ```python
    for bell in range(3):
        print("DONG!")
    ```
  related: [range, loop variable, nested loop]
- term: range
  definition: Makes the numbers for a for loop. `range(start, stop, step)` starts at start, jumps by step, and stops just before stop.
  example: '`range(1, 10, 2)` gives 1, 3, 5, 7, 9.'
  related: [for loop, off-by-one error]
- term: loop variable
  definition: The variable in a for loop that holds the current value. The loop gives it the next value on every pass, all by itself.
  example: 'In `for step in range(4):`, the loop variable is `step`. It is 0, then 1, then 2, then 3.'
  related: [for loop]
- term: accumulator
  definition: A variable that collects a total while a loop runs. It starts at 0, and every pass adds a little more.
  example: |
    ```python
    total = 0
    for coins in range(1, 4):
        total = total + coins
    ```
  related: [for loop]
- term: nested loop
  definition: A loop inside another loop. The inner loop runs all the way through on every pass of the outer loop.
  example: |
    ```python
    for row in range(2):
        for col in range(3):
            print("*")
    ```
  related: [for loop]
- term: off-by-one error
  definition: A bug where a loop runs one time too many or one time too few. With range, it often happens because range stops just before its stop number.
  example: "`range(1, 12)` stops at 11, so 12 o'clock is skipped."
  related: [range, bug]
# Region 4: Forked Road Forest
- term: boolean
  definition: A value that is either True or False. A comparison like gold >= 10 gives back a boolean.
  example: '`print(5 > 3)` shows **True**.'
  related: [comparison, condition]
- term: comparison
  definition: A check that compares two values with ==, !=, <, >, <= or >=. The answer is always True or False.
  example: '`gold >= 10` asks: is gold at least 10?'
  related: [boolean, condition]
- term: condition
  definition: A question in your code whose answer is True or False. An if statement runs its lines only when its condition is True.
  example: '`if gold >= 10:` has the condition `gold >= 10`.'
  related: [if statement, comparison, boolean]
- term: if statement
  definition: Code that runs some lines only when a condition is True. The if line ends with a colon, and the lines inside are indented.
  example: |
    ```python
    if gold >= 10:
        print("You may pass.")
    ```
  related: [condition, else, elif, indentation]
- term: else
  definition: The part of an if statement that runs when the condition is False.
  example: |
    ```python
    if gold >= 10:
        print("You may pass.")
    else:
        print("Come back later.")
    ```
  related: [if statement, elif]
- term: elif
  definition: Short for "else if". It checks another condition when the ones above it were False.
  example: |
    ```python
    if weather == "sun":
        print("Up the hill!")
    elif weather == "rain":
        print("To the mushroom grove!")
    ```
  related: [if statement, else]
- term: branch
  definition: One of the paths an if statement can take. Only one branch runs each time.
  example: An `if` with an `else` has two branches.
  related: [if statement, else]
- term: indentation
  definition: The spaces at the start of a line. Python uses indentation to see which lines belong inside an if.
  example: |
    ```python
    if gold >= 10:
        print("This line is indented by 4 spaces.")
    ```
  related: [if statement, syntax]
- term: compound condition
  definition: A condition built from smaller ones, joined with and or or.
  example: '`age >= 10 and gold >= 3` is True only when both parts are True.'
  related: [condition, boolean]
