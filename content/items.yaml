# yaml-language-server: $schema=../schema/items.schema.json
# Concept items. Each description is also a one-line summary of the concept,
# so the inventory works as a reference notebook.
- id: quill-of-printing
  name: Quill of Printing
  icon: quill
  region: hearthvale-village
  description: "`print()` writes words on the [[Scroll of Output]]. Put the words inside [[quotes]]."
  example: print("Hello, Hearthvale!")
- id: feather-of-comments
  name: Feather of Comments
  icon: feather
  region: hearthvale-village
  description: "A line that starts with `#` is a note for humans, and Python skips it."
  example: |
    # This is a comment. Python skips it.
    print("This line runs.")
- id: spyglass-of-errors
  name: Spyglass of Errors
  icon: spyglass
  region: hearthvale-village
  description: "An [[error message]] tells you what went wrong and which line to check first."
  example: |
    print("Hi)
    # SyntaxError on line 1: the quote never closed.
# Region 2: Whispering Library
- id: jar-of-labels
  name: Jar of Labels
  icon: jar
  region: whispering-library
  description: "A [[variable]] is a name for a value. `=` puts a value in the jar, and a new value replaces the old one."
  example: |
    shelf = "Mysteries"
    shelf = "Dragons"
    print(shelf)   # Dragons
- id: ink-of-formatting
  name: Ink of Formatting
  icon: inkwell
  region: whispering-library
  description: "An [[f-string]], like `f\"Hi {name}\"`, puts a variable's value inside text."
  example: |
    name = "Ada"
    print(f"Hi {name}!")
# Region 5: The Endless Mines
- id: miners-lantern
  name: Miner's Lantern
  icon: miner_lantern
  region: the-endless-mines
  description: "A `while` loop repeats its indented lines as long as its condition stays True."
  example: |
    torches = 3
    while torches > 0:
        print("Dig!")
        torches = torches - 1
- id: tally-stones
  name: Tally Stones
  icon: tally_stones
  region: the-endless-mines
  description: "A [[counter]] is a variable that goes up by 1 each time something happens: `count = count + 1`."
  example: |
    gems = 0
    gems = gems + 1
    gems = gems + 1
    print(gems)
- id: escape-rope
  name: Escape Rope
  icon: escape_rope
  region: the-endless-mines
  description: "`break` jumps out of a loop right away."
  example: |
    while True:
        print("Dig!")
        break
    print("Out of the loop!")
# Region 6: Clocktower Peaks
- id: boots-of-looping
  name: Boots of Looping
  icon: boots_of_looping
  region: clocktower-peaks
  description: "A [[for loop]] runs once for each value. `range(start, stop, step)` makes the values and stops before `stop`."
  example: |
    for step in range(1, 10, 2):
        print(step)
- id: bucket-of-totals
  name: Bucket of Totals
  icon: bucket_of_totals
  region: clocktower-peaks
  description: "An [[accumulator]] starts at 0 and adds a little more each time the loop runs."
  example: |
    total = 0
    for coins in range(1, 5):
        total = total + coins
    print(total)
- id: weavers-loom
  name: Weaver's Loom
  icon: weavers_loom
  region: clocktower-peaks
  description: "A loop inside a loop runs the inner loop all the way through for every pass of the outer loop. That's a [[nested loop]]."
  example: |
    for line in range(2):
        row = ""
        for stitch in range(3):
            row = row + "*"
        print(row)
