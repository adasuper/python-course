# yaml-language-server: $schema=../schema/items.schema.json
# Concept items. Each description is also a one-line summary of the concept,
# so the inventory works as a reference notebook.
- id: quill-of-printing
  name: Quill of Printing
  icon: quill
  region: hearthvale-village
  description: "`print()` writes words on the [[Scroll of Output]]. Put the words inside [[quotes]]."
  example: print("Hello, Hearthvale!")
- id: feather-of-comments
  name: Feather of Comments
  icon: feather
  region: hearthvale-village
  description: "A line that starts with `#` is a note for humans, and Python skips it."
  example: |
    # This is a comment. Python skips it.
    print("This line runs.")
- id: spyglass-of-errors
  name: Spyglass of Errors
  icon: spyglass
  region: hearthvale-village
  description: "An [[error message]] tells you what went wrong and which line to check first."
  example: |
    print("Hi)
    # SyntaxError on line 1: the quote never closed.
# Region 4: Forked Road Forest
- id: tuning-fork-of-truth
  name: Tuning Fork of Truth
  icon: tuning_fork
  region: forked-road-forest
  description: "A [[comparison]] like `gold >= 10` rings out `True` or `False`."
  example: |
    gold = 12
    print(gold >= 10)   # True
    print(gold == 5)    # False
- id: compass-of-conditions
  name: Compass of Conditions
  icon: condition_compass
  region: forked-road-forest
  description: "An `if` runs its indented lines only when its [[condition]] is True, and `else` covers every other case."
  example: |
    gold = 7
    if gold >= 10:
        print("Welcome through the gate!")
    else:
        print("Come back with more gold.")
- id: twin-keys-of-and-or
  name: Twin Keys of And & Or
  icon: twin_keys
  region: forked-road-forest
  description: "`and` needs both sides True, `or` needs at least one, and `not` flips True and False."
  example: |
    age = 11
    gold = 5
    print(age >= 10 and gold >= 3)   # True
    print(age >= 70 or gold >= 10)   # False
    print(not True)                  # False
