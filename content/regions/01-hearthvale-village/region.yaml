knowledge_check:
  items:
    - kind: mcq
      question: What does `print()` do?
      options:
        - It shows text on the Scroll of Output.
        - It sends the text to a paper printer.
        - It deletes a line of code.
      answer: 0
      explain: "`print()` shows text on the Scroll of Output. No paper needed!"
    - kind: predict
      question: What will this print?
      code: |
        print("Bake")
        print("Cool")
        print("Eat")
      answer: |
        Bake
        Cool
        Eat
      explain: Python runs the lines in order, top to bottom, so the words come out in that order.
    - kind: mcq
      question: Which line will Python skip?
      code: |
        # Feed the chickens
        print("Cluck!")
      options:
        - "# Feed the chickens"
        - print("Cluck!")
        - Neither line. Python runs both.
      answer: 0
      explain: A line that starts with `#` is a comment. Python skips it.
    - kind: mcq
      question: An error message says "line 3". Where do you look first?
      options:
        - Line 3 of my code
        - The first line of my code
        - The last line of my code
      answer: 0
      explain: Start at line 3. Sometimes the real slip is just above it, so check that line too.

