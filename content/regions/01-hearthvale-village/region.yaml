intro:
  - speaker: byte
    text: Welcome to Hearthvale! Cozy chimneys. Warm bread. Very loud chickens.
  - speaker: byte
    text: When the Great Script shattered, the village words got scrambled. Even the town crier shouts nonsense now.
  - speaker: byte
    text: Talk to the villagers with a **!** above their heads. Each one has a quest for you. I'll be right here, looking wise.

