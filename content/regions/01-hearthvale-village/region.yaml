concept_scene:
  title: What is a program?
  analogy: >-
    A [[program]] is like a recipe. The computer is a very literal cook. It does each step
    in order, top to bottom, exactly as written. Even if you write "add 100 eggs."
  lines:
    - speaker: byte
      text: Every program is a list of [[instructions|instruction]]. Python does them one at a time, from the top line down.
    - speaker: byte
      text: The instruction `print` shows words on the [[Scroll of Output]]. The words go inside [[quotes]].
    - speaker: byte
      text: A line that starts with `#` is a [[comment]]. It's a note for humans. Python skips it completely.
    - speaker: byte
      text: Watch this little program run. Notice the order. Then the quests are all yours.
  worked_example:
    stage: { kind: none }
    code: |
      # A comment starts with #. Python skips it.
      print("Hello, Hearthvale!")
      print("I am Byte. I am an owl.")
      print("Owls are always right.")
    explain:
      - line: 1
        text: This is a [[comment]]. Python skips it. It's a note for you.
      - line: 2
        text: The first `print` runs first. Its words appear on the Scroll.
      - line: 3
        text: Then the next line runs. Top to bottom, every time.
      - line: 4
        text: Last line, last words. (They are true words, too.)

