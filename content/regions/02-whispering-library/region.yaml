concept_scene:
  title: What is a variable?
  analogy: >-
    A [[variable]] is a labeled jar. The label is the name, and what is inside is the
    [[value]]. You can pour out the old value and put in a new one, but the jar holds only one
    thing at a time.
  lines:
    - speaker: byte
      text: '`book = "The Owl Who Coded"` makes a jar named `book` and puts the text inside. Read the `=` as "gets": book gets the text.'
    - speaker: byte
      text: Then `print(book)` shows what is IN the jar. But `print("book")`, with quotes, shows just the word book.
    - speaker: byte
      text: You can join text and jars with `+`. Or use an [[f-string]], which puts a jar's value right inside the text.
    - speaker: byte
      text: Watch this little program. Notice which lines show the jar's value. Then go label some jars!
  worked_example:
    stage: { kind: none }
    code: |
      book = "The Owl Who Coded"
      shelf = "Mysteries"
      print(book)
      print("Find " + book + " on the " + shelf + " shelf.")
      print(f"{book} lives on the {shelf} shelf.")
    explain:
      - line: 1
        text: The jar `book` gets the text "The Owl Who Coded". This is an [[assignment]].
      - line: 2
        text: A second jar, `shelf`, gets the text "Mysteries".
      - line: 3
        text: No quotes around `book`, so Python shows what is inside the jar.
      - line: 4
        text: The `+` signs [[join|concatenate]] text and jars into one sentence. Look at the spaces inside the quotes.
      - line: 5
        text: The `f` before the quote makes an [[f-string]]. Each `{jar}` is replaced by its value.

