  - speaker: narrator
    text: The books of the Whispering Library talk in hushed voices. Right now, they are whispering complaints.
  - speaker: byte
    text: When the Great Script broke, every label fell off the shelves. Now nobody can find a thing, and the books are VERY grumpy.
  - speaker: byte
    text: Madame Quill, the Head Librarian, needs an apprentice who knows how to name things. Luckily, I know an owl who knows an apprentice.

