knowledge_check:
  items:
    - kind: mcq
      question: Which one is a valid variable name?
      options:
        - gold_coins
        - 2coins
        - gold coins
        - gold-coins
      answer: 0
      explain: A name can use letters, numbers and `_`, but it can't start with a number, and it can't have spaces or dashes.
    - kind: predict
      question: What will this print?
      code: |
        pet = "owl"
        pet = "bat"
        print(pet)
      answer: bat
      explain: The jar holds one thing at a time. The second line pours out "owl" and puts in "bat".
    - kind: predict
      question: What will this print?
      code: |
        name = "Ada"
        book = "Maps"
        print(f"{name} reads {book}.")
      answer: Ada reads Maps.
      explain: In an f-string, each `{jar}` is replaced by the value inside the jar.
    - kind: mcq
      question: What is the difference between `print(name)` and `print("name")`?
      options:
        - The first shows what is inside the jar `name`. The second shows the word name.
        - There is no difference.
        - The first shows the word name. The second shows what is inside the jar.
      answer: 0
      explain: Without quotes, Python looks inside the jar. With quotes, it's just text.

