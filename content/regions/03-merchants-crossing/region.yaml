concept_scene:
  title: Coins and price tags
  analogy: >-
    `"5"` in quotes is a price tag: just a picture of a number. `5` without quotes is real
    coins you can count. `int()` turns a tag into coins, and `str()` turns coins back into a
    tag. `//` and `%` are like sharing apples: `//` is how many each friend gets, and `%` is
    what's left over.
  lines:
    - speaker: byte
      text: Python has different kinds of values. Text in quotes is a [[string]]. A whole number like `5` is an [[integer]]. A number with a dot, like `3.5`, is a [[float]].
    - speaker: byte
      text: The math [[operators|operator]] are `+ - * /`. Two more are great for sharing. `//` gives whole shares, and `%` gives the [[remainder]].
    - speaker: byte
      text: Careful! `%` is NOT percent. It means "what's left over". I learned that the hard way. Long story. It involves a pie.
    - speaker: byte
      text: Watch this example. 17 apples, 5 friends. Who gets what?
  worked_example:
    stage: { kind: none }
    code: |
      apples = 17
      friends = 5
      print(apples // friends)   # 3 apples each
      print(apples % friends)    # 2 left over
      price = int("4")           # price tag -> coins
      print(price * 3)           # 12
    explain:
      - line: 1
        text: We start with 17 apples and 5 friends.
      - line: 3
        text: "`//` shares the apples out. Each friend gets 3 whole apples."
      - line: 4
        text: "`%` finds the leftovers: 2 apples. (Byte will take care of those.)"
      - line: 5
        text: "`int()` turns the price tag `\"4\"` into the number 4."
      - line: 6
        text: Now it's a real number, so `4 * 3` is 12.

