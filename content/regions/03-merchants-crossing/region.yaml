knowledge_check:
  items:
    - kind: predict
      question: What will this print?
      code: |
        print(17 // 5)
        print(17 % 5)
      answer: |
        3
        2
      explain: "`17 // 5` is how many whole 5s fit into 17: 3. `17 % 5` is what's left over: 2."
    - kind: mcq
      question: What kind of value does `input()` hand back?
      options:
        - Text (a string), even when you type a number
        - A whole number (an int)
        - A number with a dot (a float)
      answer: 0
      explain: "`input()` always hands back text. Use `int()` to turn it into a number."
    - kind: predict
      question: What will this print?
      code: |
        print(2 + 3 * 4)
      answer: "14"
      explain: Python multiplies before it adds. `3 * 4` is 12, and 2 + 12 is 14.
    - kind: mcq
      question: This line gives a TypeError. Which line fixes it?
      code: |
        print("Total: " + 5)
      options:
        - 'print("Total: " + str(5))'
        - 'print("Total: " + int(5))'
        - 'print("Total: " * 5)'
      answer: 0
      explain: "`+` can't glue a number onto text. `str(5)` turns the number into text first."
    - kind: predict
      question: What will this print?
      code: |
        print("3" + "4")
      answer: "34"
      explain: These are strings in quotes, so `+` glues them together. It doesn't add them.

