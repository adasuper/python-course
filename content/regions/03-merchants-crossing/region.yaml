  - speaker: byte
    text: Welcome to Merchant's Crossing! Four roads meet here, and so do a LOT of shoppers.
  - speaker: byte
    text: Since the Great Script shattered, prices have gone wild. This morning, one turnip cost 4,000 gold!
  - speaker: byte
    text: A sneaky Bug is "helping" with the math. Talk to the merchants with a **!** above their heads. Bring your counting brain.

