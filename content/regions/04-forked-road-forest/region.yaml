# and indentation. See docs/curriculum-map.md.
id: forked-road-forest
number: 4
name: Forked Road Forest
concepts:
  - booleans
  - comparisons
  - if/elif/else
  - and/or/not
  - indentation

intro:
  - speaker: byte
    text: Welcome to Forked Road Forest! Every path here splits in two. Then it splits again.
  - speaker: byte
    text: The signposts used to point the way. Now they just shrug. We must teach them to make choices.
  - speaker: byte
    text: At the end of the road waits the Riddle Gate. I hear it's a little bit grumpy. Talk to anyone with a **!** to begin.

