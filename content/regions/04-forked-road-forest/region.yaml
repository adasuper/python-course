    sprite: npc_forager_tilly
    greeting: Mushrooms! I love mushrooms. I put a mushroom game on the Quest Board. Come play when the forest is safe!

concept_scene:
  title: Which way? Choosing with if
  analogy: >-
    An [[if statement]] is a signpost at a fork in the road. It asks a yes-or-no question.
    If the answer is True, you take one path. If it's False, you take the other. Only one
    path gets walked.
  lines:
    - speaker: byte
      text: Every path in this forest splits in two. The signposts used to say which way to go. Now they just shrug.
    - speaker: byte
      text: An `if` asks a question called a [[condition]], like `gold >= 10`. Python answers it with `True` or `False`.
    - speaker: byte
      text: When the answer is `True`, Python runs the indented lines under `if`. When it's `False`, it runs the lines under `else` instead.
    - speaker: byte
      text: Only one path gets walked. Never both! Run the example and watch which line Python picks.
  worked_example:
    stage: { kind: none }
    code: |
      gold = 12
      if gold >= 10:
          print("The gatekeeper waves you through.")
      else:
          print("Come back with more gold!")
    explain:
      - line: 1
        text: The purse holds 12 gold.
      - line: 2
        text: "Python checks the [[condition]]: is 12 >= 10? Yes, so it's `True`!"
      - line: 3
        text: It's `True`, so Python walks this path. The line is indented, so it belongs to the `if`.
      - line: 5
        text: Python skips this line. The `else` path only runs when the condition is `False`.

