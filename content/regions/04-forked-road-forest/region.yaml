knowledge_check:
  items:
    - kind: predict
      question: What will this print?
      code: print(5 > 3 and 2 > 4)
      answer: "False"
      explain: "`5 > 3` is True, but `2 > 4` is False. `and` needs both sides to be True, so the answer is False."
    - kind: mcq
      question: What is the difference between `=` and `==`?
      options:
        - One = stores a value in a variable. Two == check if two values are equal.
        - They mean the same thing, so use whichever you like.
        - Two == store a value twice, just to be safe.
      answer: 0
      explain: "`gold = 5` stores 5 in `gold`. `gold == 5` asks a question: is gold equal to 5? The answer is True or False."
    - kind: predict
      question: Which message will this print?
      code: |
        temp = 15
        if temp > 25:
            print("Swim in the lake!")
        elif temp > 10:
            print("Go for a walk.")
        elif temp > 0:
            print("Wear a warm coat.")
        else:
            print("Build a snow owl!")
      answer: Go for a walk.
      explain: "15 > 25 is False. 15 > 10 is True, so that path runs. Python skips the rest, even though 15 > 0 is True too. Only the first True path runs."
    - kind: mcq
      question: Why is this code wrong?
      code: |
        gold = 12
        if gold >= 10:
        print("You may pass.")
      options:
        - The print line is not indented, so Python can't tell it belongs to the if.
        - 12 is not more than 10, so the if can never run.
        - You are not allowed to use print inside an if.
      answer: 0
      explain: The lines inside an `if` must be indented, usually by 4 spaces. That's how Python knows which lines belong to it.

