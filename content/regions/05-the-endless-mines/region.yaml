knowledge_check:
  items:
    - kind: predict
      question: What will this print?
      code: |
        count = 1
        while count <= 3:
            print(count)
            count = count + 1
      answer: |
        1
        2
        3
      explain: count goes 1, 2, 3. When count is 4, `4 <= 3` is False, so the loop stops.
    - kind: mcq
      question: This loop never stops. Which line is missing inside it?
      code: |
        lamps = 0
        while lamps < 4:
            print("Light!")
      options:
        - lamps = lamps + 1
        - lamps = 0
        - print(lamps)
      answer: 0
      explain: Nothing inside the loop changes `lamps`, so `lamps < 4` stays True forever. Adding 1 each time lets it reach 4.
    - kind: mcq
      question: What does `break` do?
      options:
        - It jumps out of the loop right away.
        - It pauses the loop for a moment.
        - It starts the loop again from the top.
      answer: 0
      explain: "`break` stops the loop at once. Python goes on with the first line after the loop."
    - kind: predict
      question: How many times does this loop run? Type what the program prints.
      code: |
        while 5 < 3:
            print("Dig!")
        print("Done")
      answer: Done
      explain: Is 5 less than 3? No. The check is False the very first time, so the loop runs 0 times.

