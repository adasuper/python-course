concept_scene:
  title: What is a while loop?
  analogy: >-
    A [[while loop]] is like a miner who says, "While my lantern is lit, keep digging." Before
    each dig, the miner checks the lantern. If the lantern never runs out, the miner digs
    forever. That's an [[infinite loop]].
  lines:
    - speaker: byte
      text: Hello from out here! I'll teach this one from the entrance. The sky needs me.
    - speaker: byte
      text: A [[loop]] repeats some lines of code. A `while` loop repeats its indented lines as long as its check is True.
    - speaker: byte
      text: Python checks once **before each repeat**. True? Run the lines again. False? Jump to the line after the loop.
    - speaker: byte
      text: So something inside the loop must change. If nothing changes, the check stays True, and the loop never ends.
    - speaker: byte
      text: Watch the miner's torches run out, one at a time. Then the quests are yours. I'll be out here. Being brave. In the sunshine.
  worked_example:
    stage: { kind: none }
    code: |
      torches = 3
      while torches > 0:
          print("Light a torch and dig!")
          torches = torches - 1
      print("Out of torches. Time to rest.")
    explain:
      - line: 1
        text: The miner starts with 3 torches.
      - line: 2
        text: Python checks `torches > 0`. Is 3 more than 0? True! So the indented lines run.
      - line: 3
        text: Light a torch and dig! This line runs once each time around the loop.
      - line: 4
        text: One torch is used up. This change is what lets the loop end.
      - line: 5
        text: When torches is 0, `0 > 0` is False. The loop stops, and Python runs this line.

