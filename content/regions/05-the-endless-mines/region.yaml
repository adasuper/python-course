intro:
  - speaker: byte
    text: Welcome to the Endless Mines! The tunnels go on, and on, and on. A bit like my speeches.
  - speaker: byte
    text: The miners need help with digging and counting gems. Most of all, they need help knowing when to **stop**.
  - speaker: byte
    text: I will wait right here at the entrance. Owls prefer the sky. It has nothing to do with the dark. Or the bats. Or the dark bats.

