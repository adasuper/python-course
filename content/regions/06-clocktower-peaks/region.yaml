concept_scene:
  title: Climbing the for loop
  analogy: >-
    A [[for loop]] is like climbing stairs where every step has a number. You know how many
    steps there are before you start. `range(1, 10, 2)` is a staircase where you skip every
    other step, and you stop *before* step 10.
  lines:
    - speaker: byte
      text: In the Endless Mines, a `while` loop kept going until something changed. Up here, we know the count before we start.
    - speaker: byte
      text: That's a job for a [[for loop]]. It runs its indented lines once for each number that [[range]] makes.
    - speaker: byte
      text: Each time around, the [[loop variable]] holds the next number. You never add 1 to it yourself. The loop does that.
    - speaker: byte
      text: One thing to remember. `range` stops just *before* its stop number. Ask for `range(1, 4)` and you get 1, 2, 3. No 4. Watch!
  worked_example:
    stage: { kind: none }
    code: |
      for bell in range(1, 4):
          print(f"Bell {bell}: DONG!")
      print("The clock is happy again.")
    explain:
      - line: 1
        text: "`range(1, 4)` makes the numbers 1, 2 and 3. It stops *before* 4."
      - line: 2
        text: This line runs once for each number. Each time, `bell` holds the next one.
      - line: 3
        text: This line is not indented, so it runs once, after the loop is done.

