knowledge_check:
  items:
    - kind: predict
      question: What will this print?
      code: |
        for i in range(2, 10, 3):
            print(i)
      answer: |
        2
        5
        8
      explain: "`range(2, 10, 3)` starts at 2 and jumps by 3: 2, 5, 8. The next jump is 11, and that is past 10, so it stops."
    - kind: mcq
      question: How many times does this loop run, and what is the first value of `i`?
      code: |
        for i in range(5):
            print("Tick")
      options:
        - 5 times. The first value is 0.
        - 5 times. The first value is 1.
        - 6 times. The first value is 0.
      answer: 0
      explain: "`range(5)` gives 0, 1, 2, 3, 4. That's 5 numbers, and it starts at 0."
    - kind: predict
      question: What will this print?
      code: |
        total = 0
        for coins in range(1, 5):
            total = total + coins
        print(total)
      answer: "10"
      explain: The bucket starts at 0. Then it adds 1, 2, 3 and 4. That makes 10.
    - kind: predict
      question: How many stars does the loom weave? Type what this prints.
      code: |
        stars = 0
        for row in range(3):
            for col in range(4):
                stars = stars + 1
        print(f"{stars} stars")
      answer: 12 stars
      explain: The inner loop runs 4 times on every pass of the outer loop, and the outer loop makes 3 passes. 3 times 4 is 12.

