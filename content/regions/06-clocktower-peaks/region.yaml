# nested loops. See docs/curriculum-map.md.
id: clocktower-peaks
number: 6
name: Clocktower Peaks
concepts:
  - for loops
  - range(start, stop, step)
  - accumulators
  - nested loops

intro:
  - speaker: byte
    text: Welcome to Clocktower Peaks! The air is thin up here. Luckily, my brain is not.
  - speaker: byte
    text: The great clock keeps time for all of Codeweald. But its gears slipped. The bells rang 13 times at noon, and Tuesday happened twice last week.
  - speaker: byte
    text: The clockmakers need loops that count exactly right. Not 12 and a bit. Not 11 and a sigh. Exactly right.

